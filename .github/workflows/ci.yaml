name: CICD Project Pipeline (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: windows-latest
    
    steps:
      - name: Step 1 - Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Step 2 - Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Step 3 - Install Dependencies (CI)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 4 - Run Automated Tests (CI)
        run: |
          pytest

      - name: Step 5 - Build Docker Image (CD Preparation)
        run: |
          docker build -t cicdproject:latest .